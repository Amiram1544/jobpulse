x-backend-env:
  &backend-env
  DEBUG: "1"
  SECRET_KEY: "dev-secret-key-not-for-production"
  DJANGO_ALLOWED_HOSTS: "localhost, 127.0.0.1"
  CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
  POSTGRES_DB: "mydatabase"
  POSTGRES_USER: "mydatabase"
  POSTGRES_PASSWORD: "mydatabase"
  POSTGRES_HOST: "db"
  POSTGRES_PORT: "5432"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/1"
  CELERY_RESULT_BACKEND: "redis://redis:6379/2"

x-backend-service:
  &backend-base
  build: ./backend
  image: jobpulse-backend:latest
  environment: *backend-env

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: "mydatabase"
      POSTGRES_USER: "mydatabase"
      POSTGRES_PASSWORD: "mydatabase"
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mydatabase -d mydatabase"]
      interval: 5s
      timeout: 10s
      retries: 10
  
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  backend:
    <<: *backend-base
    restart: unless-stopped
    command: sh -c "python manage.py migrate && uvicorn config.asgi:application --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    image: jobpulse-backend:latest
    environment: *backend-env
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    

  beat:
   image: jobpulse-backend:latest
   environment: *backend-env
   restart: unless-stopped
   command: celery -A config beat --loglevel=info
   depends_on:
     redis:
       condition: service_healthy

  # frontend:
  #   build: ./frontend
  #   image: jobpulse-frontend:latest
  #   restart: unless-stopped
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     backend:
  #       condition: service_healthy

volumes:
  db_data: